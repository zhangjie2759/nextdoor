from pathlib import Path

index_html = r'''<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <!-- 移动端关键设置：避免 iPhone / 微信里画面被压缩、缩放或出现滚动条 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
  />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <title>胆小除魔师</title>

  <style>
    :root {
      --app-height: 100vh;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      overscroll-behavior: none;
      touch-action: none;
      position: fixed;
      inset: 0;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--app-height);
      overflow: hidden;
      background: #ffffff;
    }

    #gameCanvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      width: 100vw;
      height: var(--app-height);
      background: #ffffff;
      outline: none;
      border: 0;
      margin: 0;
      padding: 0;
      touch-action: none;
      image-rendering: auto;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #loading.hide {
      opacity: 0;
    }
  </style>
</head>

<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
    <div id="loading">加载中...</div>
  </div>

  <script>
    // 修复移动端 100vh 在 iPhone / 微信 / 浏览器地址栏下不稳定的问题
    (function () {
      function setAppHeight() {
        var h = window.innerHeight || document.documentElement.clientHeight || 760;
        document.documentElement.style.setProperty("--app-height", h + "px");
      }

      setAppHeight();
      window.addEventListener("resize", setAppHeight);
      window.addEventListener("orientationchange", function () {
        setTimeout(setAppHeight, 80);
        setTimeout(setAppHeight, 240);
      });

      // 阻止页面本身滚动，避免拖门时网页跟着动
      document.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      // 避免双击缩放
      var lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        function (e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false }
      );

      // 游戏脚本加载后隐藏 loading
      window.addEventListener("load", function () {
        var loading = document.getElementById("loading");
        if (!loading) return;
        setTimeout(function () {
          loading.classList.add("hide");
          setTimeout(function () {
            loading.style.display = "none";
          }, 260);
        }, 220);
      });
    })();
  </script>

  <!-- 你的 game 文件保持叫 game.js，和这个 index 放在同一级 -->
  <script src="./game.js?v=0.11.15" defer></script>
</body>
</html>
'''

path = Path("/mnt/data/index_v0.11.15_fixed.txt")
path.write_text(index_html, encoding="utf-8")
path
