<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
  />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <title>胆小除魔师</title>

  <style>
    :root {
      --app-height: 100vh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      overscroll-behavior: none;
      touch-action: none;
      position: fixed;
      inset: 0;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--app-height);
      overflow: hidden;
      background: #ffffff;
    }

    #gameCanvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      width: 100vw;
      height: var(--app-height);
      background: #ffffff;
      outline: none;
      border: 0;
      margin: 0;
      padding: 0;
      touch-action: none;
    }

    #errorTip {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: none;
      padding: 12px 14px;
      border: 3px solid #111;
      border-radius: 14px;
      background: #fffdf6;
      color: #111;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
      pointer-events: none;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
    <div id="errorTip"></div>
  </div>

  <script>
    (function () {
      function setAppHeight() {
        var h = window.innerHeight || document.documentElement.clientHeight || 760;
        document.documentElement.style.setProperty("--app-height", h + "px");
      }

      setAppHeight();

      window.addEventListener("resize", setAppHeight);
      window.addEventListener("orientationchange", function () {
        setTimeout(setAppHeight, 80);
        setTimeout(setAppHeight, 240);
      });

      document.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      var lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        function (e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false }
      );

      window.showGameError = function (text) {
        var el = document.getElementById("errorTip");
        if (!el) return;
        el.textContent = text;
        el.style.display = "block";
      };

      window.addEventListener("error", function (e) {
        var target = e && e.target;
        if (target && target.tagName === "SCRIPT") {
          window.showGameError("找不到 game.js。\n请确认文件结构是：index.html / game.js / assets/");
          return;
        }

        var msg = e && e.message ? e.message : "未知错误";
        window.showGameError("游戏脚本运行出错：\n" + msg);
      }, true);
    })();
  </script>

  <script src="./game.js?v=0.11.17"></script>
</body>
</html>
